<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tiktoken-rs Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Tiktoken-rs library documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> <!--Themes-->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"> <!--Latex-->

  <style>
    .markdown-section {
      padding-bottom: 50vh;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .card {
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      transition: all 0.3s ease;
      text-decoration: none !important;
      background-color: #ffffff;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .card h3 {
      margin-top: 15px;
      margin-bottom: 10px;
      color: #42b983;
      font-size: 1.2em;
    }

    .card p {
      font-size: 0.9em;
      color: #5c6975;
      line-height: 1.5;
      margin: 0;
    }

    .card-icon {
      font-size: 2.5em;
    }
  </style>
</head>

<body>

  <div id="app"></div>
  <script> // Github corner window
    window.$docsify = {
      name: 'Tiktoken-rs',
      repo: 'https://github.com/zurawiki/tiktoken-rs',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000, // 1 day expiration time (ms)
        paths: 'auto',
        placeholder: 'Type to search',
        noData: 'No Results!',
        depth: 3,
        hideOtherSidebarContent: false
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script> <!--Search Bar-->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script> <!--Latex-->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script> <!--Clodeblocks-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script><!--rust syntax coloring-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script> <!--bash syntax coloring-->
</body>

</html>
