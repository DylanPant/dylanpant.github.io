name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # <user>.github.io repos are served from the domain root; project repos from /<repo-name>.
      - name: Build static export
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" == *.github.io ]]; then
            export NEXT_PUBLIC_BASE_PATH=""
          else
            export NEXT_PUBLIC_BASE_PATH="/${REPO_NAME}"
          fi
          echo "Using base path: '${NEXT_PUBLIC_BASE_PATH}'"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
